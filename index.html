<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweet Delights</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Sweet Delights</h1>
      <p>Elegant desserts for every occasion</p>
    </header>

    <main>
      <!-- Cakes Section -->
      <section class="menu-section">
        <h2>Cakes</h2>
        <div class="menu-items">
          <div class="menu-item">
            <img src="images/cake1.jpg" alt="Chocolate Cake" />
            <h3>Chocolate Cake</h3>
            <p>$5.50</p>
          </div>
          <div class="menu-item">
            <img src="images/cake2.jpeg" alt="Cheesecake" />
            <h3>Cheesecake</h3>
            <p>$6.00</p>
          </div>
        </div>
      </section>

      <!-- Pastries Section -->
      <section class="menu-section">
        <h2>Pastries</h2>
        <div class="menu-items">
          <div class="menu-item">
            <img src="images/pastry1.jpg" alt="Croissant" />
            <h3>Croissant</h3>
            <p>$3.00</p>
          </div>
          <div class="menu-item">
            <img src="images/macaroon1.jpg" alt="Macaron" />
            <h3>Macaron Assortment</h3>
            <p>$4.50</p>
          </div>
        </div>
      </section>

      <!-- Drinks Section -->
      <section class="menu-section">
        <h2>Drinks & Specials</h2>
        <div class="menu-items">
          <div class="menu-item">
            <img src="images/drink1.jpg" alt="Strawberry Smoothie" />
            <h3>Strawberry Smoothie</h3>
            <p>$3.50</p>
          </div>
          <div class="menu-item">
            <img src="images/special-dessert.jpg" alt="Special Dessert" />
            <h3>Special Dessert of the Day</h3>
            <p>$7.00</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 Sweet Delights</p>
    </footer>
  </body>
</html>
